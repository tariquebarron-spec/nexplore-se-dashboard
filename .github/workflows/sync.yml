name: Sync dashboard from sandbox

on:
  schedule:
    # 06:00, 12:00 and 17:00 America/Chicago.
    # Cron is UTC and does not observe DST, so these are CDT (UTC-5) times.
    # Between early Nov and mid Mar they land an hour later in local time.
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cheerio@1.0.0 --no-save --no-audit --no-fund

      - name: Scrape sandbox and rebuild index.html
        env:
          NEX_EMAIL: ${{ secrets.NEX_EMAIL }}
          NEX_PASSWORD: ${{ secrets.NEX_PASSWORD }}
        run: node scripts/sync.js

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change — sandbox data is identical to what is published."
            exit 0
          fi
          git config user.name  "nexplore-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-sync from sandbox ($(TZ=America/Chicago date '+%d %b %Y, %-I:%M %p %Z'))"
          git push

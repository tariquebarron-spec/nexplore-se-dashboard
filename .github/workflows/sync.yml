name: Sync dashboard from sandbox

on:
  schedule:
    # Once a day at 06:00 America/New_York.
    # Cron is UTC and ignores daylight saving, so both candidate hours are listed
    # (10:00 UTC = 6am EDT, 11:00 UTC = 6am EST) and the job itself keeps whichever
    # one is actually 6am Eastern today. See the 'Check Eastern-time window' step.
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:        # run on demand from the Actions tab (ignores the window)

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Eastern-time window
        id: window
        run: |
          HOUR=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the time check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" -eq 6 ]; then
            echo "${HOUR}:00 ET — daily sync window, running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "${HOUR}:00 ET — not 6am Eastern, skipping (the other cron will fire)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: npm install cheerio@1.0.0 --no-save --no-audit --no-fund

      - name: Scrape sandbox and rebuild index.html
        if: steps.window.outputs.run == 'true'
        env:
          NEX_EMAIL: ${{ secrets.NEX_EMAIL }}
          NEX_PASSWORD: ${{ secrets.NEX_PASSWORD }}
        run: node scripts/sync.js

      - name: Commit if the data changed
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- index.html; then
            echo "No change — sandbox data is identical to what is published."
            exit 0
          fi
          git config user.name  "nexplore-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-sync from sandbox ($(TZ=America/New_York date '+%d %b %Y, %-I:%M %p %Z'))"
          git push

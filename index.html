<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nexplore Fall Placements</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --cream:#FFFAEC; --panel:#FBFAF8; --card:#FFFFFF; --sand:#F3ECD7;
  --ink:#2A2926; --ink2:#4A463F; --muted:#817C73; --line:#E7E2D9; --line2:#F0ECE4;
  --orange:#F35B16; --orange-d:#E64818; --orange-soft:#FDEEE5;
  --green:#2E9E5B; --green-soft:#E6F4EC;
  --red:#D64545; --red-soft:#FBEAEA;
  --amber:#D9900B; --amber-soft:#FBF1DE;
  --purple:#7C5CDA; --purple-soft:#EFEAFB;
  --teal:#2BA3C7;
  --r:12px; --r-sm:8px;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sh:0 4px 6px -1px rgba(34,32,29,.055),0 2px 4px -2px rgba(34,32,29,.055);
  --sh-lg:0 10px 15px -3px rgba(34,32,29,.08),0 4px 6px -4px rgba(34,32,29,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--cream);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit}

/* ---------- PIN gate ---------- */
#pinGate{position:fixed;inset:0;z-index:9999;background:var(--cream);display:flex;align-items:center;justify-content:center}
#pinGate .box{width:360px;max-width:90vw;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);padding:34px 30px;text-align:center}
#pinGate .eyebrow{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
#pinGate h1{font:350 27px/1.2 var(--serif);letter-spacing:-.5px;margin:0 0 8px}
#pinGate p{color:var(--muted);font-size:14px;margin:0 0 20px}
#pinGate input{width:100%;padding:12px 14px;font:500 20px/1 var(--mono);letter-spacing:.3em;text-align:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);outline:none}
#pinGate input:focus{border-color:var(--orange);background:#fff}
#pinGate button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
#pinGate button:hover{background:var(--orange-d)}
#pinErr{color:var(--red);font-size:13px;height:18px;margin-top:10px}

/* ---------- shell ---------- */
#app{display:none;height:100%}
#app.on{display:flex}
#side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px}
.brand .word{font:400 20px/1 var(--serif);letter-spacing:-.2px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--ink2);font-size:14.5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.navitem svg{flex:0 0 18px;opacity:.72}
.navitem:hover{background:#F3F0EA}
.navitem.on{background:#EFEBE3;color:var(--ink);font-weight:600}
.navitem.on svg{opacity:1;color:var(--orange)}
.navitem .cnt{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--muted)}
.sidefoot{margin-top:auto;padding:12px 11px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.45}

#main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line2);background:var(--cream)}
#topbar h1{margin:0;font:600 19px/1.2 var(--sans);letter-spacing:-.2px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
#content{flex:1;overflow:auto;padding:22px 26px 60px}
.view{display:none}
.view.on{display:block}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card .hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.card .hd h2{margin:0;font:600 15.5px/1.3 var(--sans)}
.card .bd{padding:18px 20px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.serifhead{font:350 30px/1.18 var(--serif);letter-spacing:-.6px;margin:10px 0 0}
.grid2{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}}

.bignum{font:600 34px/1.1 var(--sans);letter-spacing:-1px;margin:8px 0 2px}
.delta{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600}
.delta.up{color:var(--green)} .delta.dn{color:var(--red)}
.sub{color:var(--muted);font-size:13.5px;font-weight:400}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .k{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 23px/1.1 var(--sans);letter-spacing:-.5px;margin-top:7px}
.stat.acc .v{color:var(--orange)}
.stat.ok .v{color:var(--green)}
.stat.warn .v{color:var(--red)}

/* group rows */
.group{margin-bottom:14px}
.grouphd{display:flex;align-items:center;gap:9px;padding:14px 20px;cursor:pointer;user-select:none}
.grouphd .chev{transition:transform .15s;opacity:.5}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .rows{display:none}
.grouphd .gname{font-weight:600;font-size:15px}
.grouphd .gtot{margin-left:auto;font-weight:600;font-size:15px}
.row{display:flex;align-items:center;gap:13px;padding:11px 20px;border-top:1px solid var(--line2)}
.row:hover{background:#FDFCF9}
.ava{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12.5px/1 var(--sans);color:#fff;background:var(--orange)}
.ava.g{background:var(--green)} .ava.r{background:var(--red)} .ava.p{background:var(--purple)} .ava.a{background:var(--amber)}
.rmain{min-width:0;flex:1}
.rname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rval{text-align:right;flex:0 0 auto}
.rv1{font-weight:600;font-size:14.5px}
.rv2{color:var(--muted);font-size:12px;margin-top:2px}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font:600 11px/1.5 var(--sans);letter-spacing:.02em}
.pill.ok{background:var(--green-soft);color:#1E7A43}
.pill.open{background:var(--red-soft);color:#B13232}
.pill.warn{background:var(--amber-soft);color:#9A6605}
.pill.info{background:var(--purple-soft);color:#5B40B0}
.pill.mut{background:#F1EEE8;color:var(--muted)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#FDFCF9}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{max-height:calc(100vh - 290px);overflow:auto}

/* summary */
.barstack{display:flex;height:9px;border-radius:999px;overflow:hidden;margin:12px 0 14px;background:var(--line2)}
.barstack i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.legend .ln{flex:1;color:var(--ink2)}
.legend .lv{font-weight:600;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px;margin-left:auto}
.toggle button{border:0;background:none;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}

/* chart */
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:210px;overflow:visible}
.cx{font:500 10.5px/1 var(--mono);fill:var(--muted)}

/* map */
#mapcard{height:calc(100vh - 168px);min-height:460px;position:relative;overflow:hidden}
#map{position:absolute;inset:0;border-radius:var(--r)}
#layerBox{position:absolute;top:14px;left:14px;z-index:5;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);padding:12px;width:174px;backdrop-filter:blur(6px)}
#layerBox .lb{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
#layerBox button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;margin-bottom:4px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
#layerBox button .sw{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
#layerBox button.off{opacity:.42;background:var(--panel)}
#layerBox button .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--muted)}
#newPanel{position:absolute;top:14px;right:14px;z-index:5;width:330px}
#newPanel .tab{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);padding:10px 14px;font-size:13.5px;font-weight:600;cursor:default;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
#newPanel .drop{display:none;margin-top:8px;max-height:calc(100vh - 290px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg)}
#newPanel:hover .drop{display:block}
.npi{padding:12px 14px;border-bottom:1px solid var(--line2)}
.npi:last-child{border-bottom:0}
.npi .t{display:flex;align-items:center;gap:8px}
.npi .nm{font-weight:600;font-size:14px}
.npi .meta{color:var(--muted);font-size:12.5px;margin:3px 0 7px}
.npi .sug{font-size:12.5px;color:var(--ink2);padding:3px 0;display:flex;gap:7px}
.npi .sug b{font-weight:600}
.npi .mi{font:500 11px/1 var(--mono);color:var(--orange);white-space:nowrap}

/* markers */
.site-marker,.trip-marker,.instr-marker{cursor:pointer;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(34,32,29,.35)}
.site-marker{width:17px;height:17px}
.site-marker.open{background:var(--red)}
.site-marker.filled{background:var(--green)}
.site-marker.part{background:var(--amber)}
.trip-marker{width:15px;height:15px;border-radius:3px;background:var(--purple)}
.instr-marker{width:9px;height:9px;background:var(--teal);border-width:1.5px;box-shadow:0 1px 2px rgba(34,32,29,.3)}
.maplibregl-popup-content{border-radius:var(--r)!important;padding:14px 16px!important;box-shadow:var(--sh-lg)!important;border:1px solid var(--line);font-family:var(--sans)}
.pop h3{margin:0 0 3px;font:600 14.5px/1.3 var(--sans)}
.pop .ps{color:var(--muted);font-size:12.5px;margin-bottom:9px}
.pop .pc{border-top:1px solid var(--line2);padding-top:8px;margin-top:8px;font-size:12.5px}
.pop a{color:var(--orange);font-weight:600;text-decoration:none}

/* checklist */
.ckrow{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line2)}
.ckrow:hover{background:#FDFCF9}
.cks{display:flex;gap:6px;flex:0 0 auto}
.ck{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;padding:0}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.ckhead{display:flex;gap:6px;flex:0 0 auto}
.ckhead span{width:26px;text-align:center;font:500 9px/1.15 var(--mono);color:var(--muted);text-transform:uppercase}
.note{background:var(--sand);border-radius:var(--r);padding:14px 17px;font-size:13.5px;color:var(--ink2);line-height:1.55;margin-bottom:18px}
.note b{font-weight:600;color:var(--ink)}
.srch{padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:var(--card);outline:none;width:230px;font-family:inherit}
.srch:focus{border-color:var(--orange)}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>

  </section>
</div>

<script>

function unlock(){ try{sessionStorage.setItem('nexUnlocked','1');}catch(e){} gate.remove(); app.classList.add('on'); boot(); }
function tryPin(){
  var v=document.getElementById('pinInput').value.trim();

/* ================= helpers ================= */
var MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
var YEAR=TODAY.getFullYear();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function parseMD(s){
  if(!s) return null;
  var m=String(s).trim().match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2})$/);
  if(!m || !(m[1] in MON)) return null;
  var d=new Date(YEAR, MON[m[1]], +m[2]); d.setHours(0,0,0,0);
  // a date more than 5 months behind us is next year's
  if((TODAY-d)/86400000 > 150) d.setFullYear(YEAR+1);
  return d;
}
function daysOut(s){ var d=parseMD(s); return d===null?null:Math.round((d-TODAY)/86400000); }
function fmtDays(n){
  if(n===null) return '—';
  if(n<0) return Math.abs(n)+'d ago';
  if(n===0) return 'today';
  return 'in '+n+'d';
}
function initials(n){ var p=String(n||'').replace(/\*+/g,'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function clean(n){ return String(n||'').replace(/\*+$/,'').trim(); }
function hav(a,b,c,d){
  if([a,b,c,d].some(function(x){return typeof x!=='number'||isNaN(x);})) return null;
  var R=3958.8,t=Math.PI/180,dla=(c-a)*t,dlo=(d-b)*t;
  var h=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dlo/2)*Math.sin(dlo/2);
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function el(id){ return document.getElementById(id); }
function store(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var INSTR_BY_NAME={}; INSTRUCTORS.forEach(function(i){ INSTR_BY_NAME[clean(i.name).toLowerCase()]=i; });

function hireDate(i){
  if(!i.startDate) return null;
  var m=String(i.startDate).match(/^(\d{2})-(\d{2})-(\d{4})$/);
  return m? new Date(+m[3], +m[1]-1, +m[2]) : null;
}

};
var VIEWS=[

  {id:'map',   t:'Placement map',lbl:'Map'},
  {id:'sites', t:'Sites',       lbl:'Sites',       n:function(){return DATA.length;}},

];

function buildNav(){
  el('nav').innerHTML = VIEWS.map(function(v){

  render(id,'');

/* ================= dashboard ================= */
function areaChart(){
  // real data: classes bucketed by start week, split filled / open
  var buckets={};
  ALLCLASSES.forEach(function(c){
    var d=parseMD(c.startDate); if(!d) return;
    var wk=new Date(d); wk.setDate(wk.getDate()-wk.getDay());
    var k=wk.getTime();
    buckets[k]=buckets[k]||{f:0,o:0,d:wk};
    if(c.status==='filled') buckets[k].f++; else buckets[k].o++;
  });
  var keys=Object.keys(buckets).map(Number).sort(function(a,b){return a-b;});
  if(!keys.length) return '<div class="empty">No dated classes to chart.</div>';
  var pts=keys.map(function(k){return buckets[k];});
  var W=100, H=100, n=pts.length;
  var max=Math.max.apply(null,pts.map(function(p){return p.f+p.o;}))||1;
  function X(i){ return n===1?50:(i/(n-1))*W; }
  function Y(v){ return H-(v/max)*H; }
  var topLine=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(2)+' '+Y(p.f+p.o).toFixed(2);}).join(' ');
  var fillLine=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(2)+' '+Y(p.f).toFixed(2);}).join(' ');
  var area=topLine+' L'+X(n-1).toFixed(2)+' '+H+' L'+X(0).toFixed(2)+' '+H+' Z';
  var areaF=fillLine+' L'+X(n-1).toFixed(2)+' '+H+' L'+X(0).toFixed(2)+' '+H+' Z';
  var step=n>8?Math.ceil(n/6):1;
  var lbls='<div style="position:relative;height:16px;margin-top:6px">'+pts.map(function(p,i){
    if(i%step!==0 && i!==n-1) return '';
    var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][p.d.getMonth()];
    var pc=(X(i)/W)*100, tr=(i===0?'0':(i===n-1?'-100%':'-50%'));
    return '<span style="position:absolute;left:'+pc.toFixed(2)+'%;transform:translateX('+tr+');font:500 10.5px/1 var(--mono);color:var(--muted);white-space:nowrap">'+m+' '+p.d.getDate()+'</span>';
  }).join('')+'</div>';
  return '<div class="chartwrap"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:172px">'+
    '<defs>'+
    '<linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F35B16" stop-opacity=".20"/><stop offset="1" stop-color="#F35B16" stop-opacity="0"/></linearGradient>'+
    '<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E9E5B" stop-opacity=".26"/><stop offset="1" stop-color="#2E9E5B" stop-opacity="0"/></linearGradient>'+
    '</defs>'+
    '<path d="'+area+'" fill="url(#gO)"/>'+
    '<path d="'+areaF+'" fill="url(#gG)"/>'+
    '<path d="'+topLine+'" fill="none" stroke="#F35B16" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
    '<path d="'+fillLine+'" fill="none" stroke="#2E9E5B" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
    '</svg>'+lbls+
    '<div style="display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--muted)">'+
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#F35B16;margin-right:6px"></i>All classes starting that week</span>'+
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2E9E5B;margin-right:6px"></i>Staffed</span>'+
    '</div></div>';
}

function dashGroups(){
  // urgent open sites, then open, then staffed
  var rows=DATA.map(function(s){
    var cls=s.classes||[], op=cls.filter(function(c){return c.status!=='filled';});

    return {s:s,cls:cls,op:op,soon:soon};
  });
  var overdue=rows.filter(function(r){ return r.op.length && r.soon!==null && r.soon<0; }).sort(function(a,b){return a.soon-b.soon;});
  var urgent=rows.filter(function(r){ return r.op.length && r.soon!==null && r.soon>=0 && r.soon<=14; }).sort(function(a,b){return a.soon-b.soon;});
  var open=rows.filter(function(r){ return r.op.length && overdue.indexOf(r)<0 && urgent.indexOf(r)<0; }).sort(function(a,b){return (a.soon===null?999:a.soon)-(b.soon===null?999:b.soon);});
  var done=rows.filter(function(r){ return !r.op.length && r.cls.length; });
  function grp(id,name,arr,cls,tot){
    if(!arr.length) return '';
    return '<div class="card group'+(id==='g3'?' closed':'')+'" id="'+id+'" style="margin-bottom:14px">'+
      '<div class="grouphd"><svg class="chev" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5l5 5 5-5"/></svg>'+
      '<span class="gname">'+esc(name)+'</span><span class="pill '+cls+'">'+arr.length+' sites</span>'+
      '<span class="gtot">'+tot+'</span></div><div class="rows">'+
      arr.map(function(r){
        return '<div class="row"><div class="ava '+(r.op.length?(r.soon!==null&&r.soon<=14?'r':'a'):'g')+'">'+esc(initials(r.s.name)||'·')+'</div>'+
          '<div class="rmain"><div class="rname">'+esc(r.s.name)+'</div>'+
          '<div class="rsub">'+esc(r.s.region)+' · '+esc(r.s.city)+', '+esc(r.s.state)+'</div></div>'+
          '<div class="rval"><div class="rv1">'+(r.op.length? r.op.length+' open' : r.cls.length+' staffed')+'</div>'+
          '<div class="rv2">'+(r.soon!==null?fmtDays(r.soon):(r.cls.length+' classes'))+'</div></div></div>';
      }).join('')+'</div></div>';
  }
  var vt=overdue.reduce(function(a,r){return a+r.op.length;},0);
  var ut=urgent.reduce(function(a,r){return a+r.op.length;},0);
  var ot=open.reduce(function(a,r){return a+r.op.length;},0);
  var dt=done.reduce(function(a,r){return a+r.cls.length;},0);
  return grp('g0','Overdue — start date passed, still unstaffed',overdue,'open',vt+' open')+
         grp('g1','Urgent — starts within 14 days',urgent,'open',ut+' open')+
         grp('g2','Needs an instructor',open,'warn',ot+' open')+
         grp('g3','Fully staffed',done,'ok',dt+' classes');
}

function tableCard(title,cols,rows,note){

}
function match(q,arr){ if(!q) return true; q=q.toLowerCase(); return arr.some(function(v){ return String(v==null?'':v).toLowerCase().indexOf(q)>=0; }); }

/* ================= readiness ================= */
function renderReady(q){
  var staffed=Object.keys(ASSIGNED);
  var rows=[], trainingInfo=[], flagged=0;
  staffed.sort().forEach(function(k){
    var rec=INSTR_BY_NAME[k];
    var cls=ASSIGNED[k];
    var nm=clean(cls[0].instructor);
    if(q && !match(q,[nm,cls.map(function(c){return c.site;}).join(' ')])) return;
    var flags=[];
    if(!rec){ flags.push('not found in roster'); }
    else{
      if(!/complete/i.test(rec.hrFile||'')) flags.push('HR file');
      if(!rec.phone) flags.push('no phone');
      if(!rec.email) flags.push('no email');
      if(rec.lastLogin==='Never') flags.push('never logged in');
      var m=String(rec.training||'').match(/^(\d+)\s*\/\s*(\d+)$/);
      if(m && m[1]!==m[2]) trainingInfo.push(nm);
    }
    if(flags.length) flagged++;
    rows.push('<tr><td><b>'+esc(nm)+'</b><div style="color:var(--muted);font-size:12px">'+esc((rec&&rec.region)||'')+'</div></td>'+
      '<td>'+cls.map(function(c){return esc(c.site)+' <span style="color:var(--muted)">('+esc(c.startDate||'—')+')</span>';}).join('<br>')+'</td>'+
      '<td class="num">'+cls.length+'</td>'+
      '<td>'+(flags.length?'<span class="pill open">'+esc(flags.join(' · '))+'</span>':'<span class="pill ok">Ready</span>')+'</td></tr>');
  });
  var note='<b>'+(staffed.length-flagged)+' of '+staffed.length+'</b> assigned instructors have a complete HR file, contact details and a login on record. '+
    (trainingInfo.length?'Separately, '+trainingInfo.length+' show an incomplete training count — no instructor in the roster of '+INSTRUCTORS.length+' shows a completed count, so this looks like the sandbox Training field is not being kept up to date rather than a real gap. It is not counted above.':'');
  el('v-ready').innerHTML=tableCard('Assigned-instructor readiness',[{t:'Instructor'},{t:'Classes'},{t:'#',num:1},{t:'Check'}],rows,note);
}

/* ================= outreach checklist ================= */
var CKS=[{k:'conf',t:'Class confirm'},{k:'beatriz',t:'Beatriz call'},{k:'d5',t:'5-day'},{k:'d1',t:'1-day'},{k:'call',t:'Call / text'}];
function renderOutreach(q){
  var state=store('nexOutreach',{});
  var names=Object.keys(ASSIGNED).sort();
  var done=0, total=0;
  var rows=names.map(function(k){
    var cls=ASSIGNED[k], nm=clean(cls[0].instructor), rec=INSTR_BY_NAME[k];
    var st=state[k]||{};
    CKS.forEach(function(c){ total++; if(st[c.k]) done++; });
    if(q && !match(q,[nm, cls.map(function(c){return c.site;}).join(' ')])) return '';
    var n=CKS.filter(function(c){return st[c.k];}).length;
    return '<div class="ckrow"><div class="ava '+(n===5?'g':n?'a':'r')+'">'+esc(initials(nm)||'·')+'</div>'+
      '<div class="rmain"><div class="rname">'+esc(nm)+'</div>'+
      '<div class="rsub">'+esc(cls[0].site)+(cls.length>1?' +'+(cls.length-1)+' more':'')+' · starts '+esc(cls[0].startDate||'—')+
      (rec&&rec.phone?' · '+esc(rec.phone):'')+'</div></div>'+
      '<div class="cks">'+CKS.map(function(c){
        return '<button class="ck'+(st[c.k]?' on':'')+'" data-k="'+esc(k)+'" data-c="'+c.k+'" title="'+esc(c.t)+'">✓</button>';
      }).join('')+'</div></div>';
  }).filter(Boolean);
  el('v-outreach').innerHTML=
    '<div class="note">Tick each instructor off as outreach happens. <b>'+done+' of '+total+'</b> steps complete across '+names.length+' assigned instructors. '+
    'Ticks are saved in <b>this browser only</b> — they do not sync between people or devices. Say the word and I can back them with the Google Sheet instead so the whole team sees the same state.</div>'+
    '<div class="card"><div class="hd"><h2>Outreach checklist</h2>'+
    '<div class="ckhead" style="margin-left:auto">'+CKS.map(function(c){return '<span>'+esc(c.t)+'</span>';}).join('')+'</div></div>'+
    (rows.length?rows.join(''):'<div class="empty">Nothing matches that search.</div>')+'</div>';
  Array.prototype.forEach.call(el('v-outreach').querySelectorAll('.ck'),function(b){
    b.addEventListener('click',function(){
      var s=store('nexOutreach',{}); var k=b.getAttribute('data-k'), c=b.getAttribute('data-c');
      s[k]=s[k]||{}; s[k][c]=!s[k][c]; save('nexOutreach',s); renderOutreach(el('q').value.trim());
    });
  });
}

/* ================= map ================= */
var map=null, siteMarkers=[], tripMarkers=[], instrMarkers=[];
var layerState={sites:true,trips:true,instr:true};
function mk(cls,html,lat,lon,arr){
  if(typeof lat!=='number'||typeof lon!=='number'||isNaN(lat)||isNaN(lon)) return;
  var d=document.createElement('div'); d.className=cls;
  var m=new maplibregl.Marker({element:d}).setLngLat([lon,lat])
    .setPopup(new maplibregl.Popup({offset:14,maxWidth:'320px'}).setHTML(html));
  arr.push(m);
}
function buildMap(){
  if(mapBuilt) { setTimeout(function(){ if(map) map.resize(); },60); return; }
  mapBuilt=true;
  map=new maplibregl.Map({
    container:'map',
    style:'https://tiles.openfreemap.org/styles/positron',
    center:[-88,29.6], zoom:4.1, attributionControl:{compact:true}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');

  DATA.forEach(function(s){
    var cls=s.classes||[], op=cls.filter(function(c){return c.status!=='filled';});
    var k=op.length===0?'filled':(op.length===cls.length?'open':'part');
    var html='<div class="pop"><h3>'+esc(s.name)+'</h3>'+
      '<div class="ps">'+esc(s.region)+' · '+esc(s.address)+', '+esc(s.city)+', '+esc(s.state)+' '+esc(s.zip)+'</div>'+
      cls.map(function(c){
        return '<div class="pc"><b>'+esc(c.course)+'</b> <span style="color:var(--muted)">'+esc(c.program)+'</span><br>'+
          esc(c.startDate||'—')+' · '+esc(c.time||'')+'<br>'+
          (c.status==='filled'?'<span class="pill ok">'+esc(clean(c.instructor)||'Staffed')+'</span>':'<span class="pill open">Needs instructor</span>')+'</div>';
      }).join('')+'</div>';
    mk('site-marker '+k, html, s.lat, s.lon, siteMarkers);
  });
  TRIPS.forEach(function(t){
    var html='<div class="pop"><h3>'+esc(t.site)+'</h3>'+
      '<div class="ps">Field trip · '+esc(t.region)+' · '+esc(t.city)+', '+esc(t.state)+'</div>'+
      '<div class="pc">'+esc(t.program)+'<br>'+esc(t.day)+' '+esc(t.date)+' · '+esc(t.time)+'<br>'+
      esc(t.grade)+' · '+esc(t.students)+' students'+(t.psm?'<br>PSM: '+esc(t.psm):'')+'<br>'+
      (t.instructor?'<span class="pill ok">'+esc(clean(t.instructor))+'</span>':'<span class="pill open">Needs instructor</span>')+'</div></div>';
    mk('trip-marker', html, t.lat, t.lon, tripMarkers);
  });
  INSTRUCTORS.forEach(function(i){
    var a=ASSIGNED[clean(i.name).toLowerCase()]||[];
    var html='<div class="pop"><h3>'+esc(clean(i.name))+'</h3>'+
      '<div class="ps">'+esc(i.region||'')+' · '+esc(i.state||'')+' '+esc(i.zip||'')+'</div>'+
      '<div class="pc">'+(i.phone?'<a href="tel:'+esc(String(i.phone).replace(/[^\d+]/g,''))+'">'+esc(i.phone)+'</a>':'<span style="color:var(--muted)">No phone on file</span>')+
      (i.email?'<br>'+esc(i.email):'')+'<br>'+
      (a.length?'<span class="pill ok">'+a.length+' class'+(a.length>1?'es':'')+'</span>':'<span class="pill mut">Not placed</span>')+'</div></div>';
    mk('instr-marker', html, i.lat, i.lon, instrMarkers);
  });

  el('layerBox').innerHTML='<div class="lb">Layers</div>'+
    '<button id="lyrSites"><span class="sw" style="background:var(--red)"></span>Class sites<span class="n">'+siteMarkers.length+'</span></button>'+
    '<button id="lyrTrips"><span class="sw" style="background:var(--purple)"></span>Field trips<span class="n">'+tripMarkers.length+'</span></button>'+
    '<button id="lyrInstr"><span class="sw" style="background:var(--teal)"></span>Instructors<span class="n">'+instrMarkers.length+'</span></button>';
  function apply(){
    siteMarkers.forEach(function(m){ layerState.sites?m.addTo(map):m.remove(); });
    tripMarkers.forEach(function(m){ layerState.trips?m.addTo(map):m.remove(); });
    instrMarkers.forEach(function(m){ layerState.instr?m.addTo(map):m.remove(); });
    el('lyrSites').classList.toggle('off',!layerState.sites);
    el('lyrTrips').classList.toggle('off',!layerState.trips);
    el('lyrInstr').classList.toggle('off',!layerState.instr);
  }
  el('lyrSites').addEventListener('click',function(){ layerState.sites=!layerState.sites; apply(); });
  el('lyrTrips').addEventListener('click',function(){ layerState.trips=!layerState.trips; apply(); });
  el('lyrInstr').addEventListener('click',function(){ layerState.instr=!layerState.instr; apply(); });
  map.on('load',function(){ apply(); map.resize(); });
  apply();
  setTimeout(function(){ map.resize(); },200);
  setTimeout(function(){ map.resize(); },900);
  window.addEventListener('resize',function(){ if(map) map.resize(); });

  buildNewPanel();
  window.__nexMap={map:map,siteMarkers:siteMarkers,tripMarkers:tripMarkers,instrMarkers:instrMarkers,layerState:layerState};
}
function buildNewPanel(){
  var openSites=DATA.filter(siteOpen);
  var items=NEWI.map(function(i){
    var placed=ASSIGNED[clean(i.name).toLowerCase()];
    var near=openSites.map(function(s){ return {s:s,d:hav(i.lat,i.lon,s.lat,s.lon)}; })
      .filter(function(x){ return x.d!==null && x.d<=45; })
      .sort(function(a,b){return a.d-b.d;}).slice(0,3);
    return '<div class="npi"><div class="t"><span class="nm">'+esc(clean(i.name))+'</span>'+
      '<span class="pill '+(placed?'ok':'open')+'" style="margin-left:auto">'+(placed?'Placed':'Not placed')+'</span></div>'+
      '<div class="meta">'+esc(i.region||'—')+' · '+esc(i.state||'')+' '+esc(i.zip||'')+
      (i.phone?' · <a href="tel:'+esc(String(i.phone).replace(/[^\d+]/g,''))+'" style="color:var(--orange);font-weight:600;text-decoration:none">'+esc(i.phone)+'</a>':'')+
      ' · hired '+esc(i.startDate||'—')+'</div>'+
      (near.length?near.map(function(x){
        var op=(x.s.classes||[]).filter(function(c){return c.status!=='filled';});
        return '<div class="sug"><b>'+esc(x.s.name)+'</b><span style="color:var(--muted)">'+op.length+' open</span><span class="mi" style="margin-left:auto">'+x.d.toFixed(0)+' mi</span></div>';
      }).join(''):'<div class="sug" style="color:var(--muted)">No open site within 45 miles.</div>')+
    '</div>';
  }).join('');
  el('newPanel').innerHTML='<div class="tab"><span class="pill info">New</span>'+NEWI.length+' instructors hired in 60 days'+
    '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;opacity:.5"><path d="M5 7.5l5 5 5-5"/></svg></div>'+
    '<div class="drop">'+(items||'<div class="empty">No new instructors in the last 60 days.</div>')+'</div>';
}

/* ================= CSV ================= */
function csv(rows){
  return rows.map(function(r){ return r.map(function(c){ var s=String(c==null?'':c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(','); }).join('\n');
}
function exportCsv(){
  var rows, name;
  if(CUR==='instr'){ name='instructors'; rows=[['Name','Region','State','Zip','Phone','Email','HR file','Training','Classes']];
    INSTRUCTORS.forEach(function(i){ rows.push([clean(i.name),i.region,i.state,i.zip,i.phone,i.email,i.hrFile,i.training,(ASSIGNED[clean(i.name).toLowerCase()]||[]).length]); }); }
  else if(CUR==='trips'){ name='field-trips'; rows=[['Site','City','State','Region','Program','Date','Day','Time','Grades','Students','PSM','Instructor','Status']];
    TRIPS.forEach(function(t){ rows.push([t.site,t.city,t.state,t.region,t.program,t.date,t.day,t.time,t.grade,t.students,t.psm,clean(t.instructor),t.instructor?'assigned':'open']); }); }
  else if(CUR==='sites'){ name='sites'; rows=[['Site','Region','City','State','Address','Zip','Classes','Open']];
    DATA.forEach(function(s){ var c=s.classes||[]; rows.push([s.name,s.region,s.city,s.state,s.address,s.zip,c.length,c.filter(function(x){return x.status!=='filled';}).length]); }); }
  else { name='classes'; rows=[['Site','Region','City','State','Program','Course','Starts','Day/Time','Instructor','Status','Days out']];
    ALLCLASSES.forEach(function(c){ rows.push([c.site,c.region,c.city,c.state,c.program,c.course,c.startDate,c.time,clean(c.instructor),c.status,c.days]); }); }
  var b=new Blob([csv(rows)],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='nexplore-'+name+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ================= router ================= */
function render(id,q){
  if(id==='dash') renderDash();
  else if(id==='sites') renderSites(q);
  else if(id==='classes') renderClasses(q);
  else if(id==='instr') renderInstr(q);
  else if(id==='trips') renderTrips(q);
  else if(id==='ready') renderReady(q);
  else if(id==='outreach') renderOutreach(q);
}
function boot(){
  buildNav();
  el('stamp').textContent='Sandbox snapshot: 4 Sep 2026';
  el('btnCsv').addEventListener('click',exportCsv);
  var t=null;
  el('q').addEventListener('input',function(){ clearTimeout(t); t=setTimeout(function(){ render(CUR, el('q').value.trim()); },130); });
  renderDash();
  window.__nex={DATA:DATA,INSTRUCTORS:INSTRUCTORS,TRIPS:TRIPS,ALLCLASSES:ALLCLASSES,go:go};
}

var pre=false; try{ pre = sessionStorage.getItem('nexUnlocked')==='1'; }catch(e){}
if(pre){ unlock(); } else { setTimeout(function(){ var i=document.getElementById('pinInput'); if(i) i.focus(); },60); }
})();
</script>
